[package]
name = "compositor"
version = "0.1.0"
edition = "2021"
description = "GPU-accelerated video frame compositor using wgpu"

[dependencies]
wgpu = { version = "22", features = ["wgsl"] }
image = { version = "0.25", default-features = false, features = ["png"] }
bytemuck = { version = "1", features = ["derive"] }
thiserror = "1"
log = "0.4"
